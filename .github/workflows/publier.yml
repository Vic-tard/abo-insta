# Mise en ligne du site sur Cloudflare Pages (zieuton.com, FOU-90) ET sur GitHub Pages, avec la signature des mises à jour (FOU-29).
# Cloudflare passe en premier : si GitHub Pages tombe (compte suspendu, panne), zieuton.com reste à jour.
# Réglage nécessaire une fois : secret CLOUDFLARE_API_TOKEN (jeton Cloudflare « Cloudflare Pages : Edit »).
# Sans ce secret, l'étape Cloudflare est sautée et un avertissement s'affiche.
# À chaque fusion sur main : copie le site, signe index.html et channel.json avec la clé secrète
# de Victor (secret PAGE_SIGNING_KEY), publie index.html.sig et channel.json.sig à côté, puis met en ligne.
# L'app iPhone (coque version 9 et plus) refuse une page dont la signature n'est pas bonne.
# Réglage nécessaire une fois : Settings → Pages → Source : « GitHub Actions » (docs/MISES-A-JOUR.md, partie 4).
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    name: Signer et mettre en ligne
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copier le site (comme avant, sans les fichiers techniques de git)
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude node_modules ./ "$RUNNER_TEMP/site/"

      - name: Signer index.html et channel.json
        env:
          PAGE_SIGNING_KEY: ${{ secrets.PAGE_SIGNING_KEY }}
        run: node scripts/signature.mjs signer "$RUNNER_TEMP/site"

      - name: Mettre en ligne sur Cloudflare Pages (zieuton.com)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4ce3616759c339c0947d70c9fb43b2f6
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN absent : zieuton.com n'est PAS mis à jour."
            exit 0
          fi
          # Le projet « zieuton » est créé la première fois (production = branche main).
          if ! npx --yes wrangler@3.114.17 pages project list | grep -qw zieuton; then
            npx --yes wrangler@3.114.17 pages project create zieuton --production-branch=main
          fi
          npx --yes wrangler@3.114.17 pages deploy "$RUNNER_TEMP/site" --project-name=zieuton --branch=main --commit-dirty=true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Mettre en ligne
        id: deploy
        uses: actions/deploy-pages@v4
