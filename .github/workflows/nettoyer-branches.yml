# FOU-45 : supprime une seule fois les branches fusionnées ou abandonnées.
# Lancement à la main : onglet Actions → « Nettoyer les branches » → Run workflow.
# La liste est dans scripts/branches-a-supprimer.txt (nom + code du dernier commit).
# Une branche qui a bougé depuis la liste n'est pas supprimée.
name: Nettoyer les branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supprimer les branches de la liste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          supprimees=0; gardees=0; echecs=0
          while read -r branche code; do
            [ -z "$branche" ] && continue
            actuel=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branche" --jq .object.sha 2>/dev/null || echo "absente")
            if [ "$actuel" = "absente" ]; then echo "Déjà absente : $branche"; continue; fi
            if [ "$actuel" != "$code" ]; then echo "Gardée (a bougé) : $branche"; gardees=$((gardees+1)); continue; fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branche"; then
              echo "Supprimée : $branche"; supprimees=$((supprimees+1))
            else
              echo "::error::Échec : $branche"; echecs=$((echecs+1))
            fi
          done < scripts/branches-a-supprimer.txt
          echo "Bilan : $supprimees supprimées, $gardees gardées, $echecs échecs" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$echecs" -eq 0 ]
